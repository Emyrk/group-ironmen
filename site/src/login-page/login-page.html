<div class="login__container rsborder rsbackground">
  <h2>${this.guestMode ? "Guest Mode" : "Login"}</h2>
  ${this.guestMode ? "<p>Enter a group name to view its data without making changes.</p>" : ""}
  <men-input
    class="login__name"
    input-id="groupName"
    placeholder-text="Group name"
    input-label="Group name"
  ></men-input>
  ${ this.guestMode ? "" : `
  <men-input
    class="login__token"
    max-length="60"
    input-id="groupToken"
    placeholder-text="Group token"
    input-label="Group token"
    type-password
  ></men-input>
  ` }
  <button class="login__button men-button">${this.guestMode ? "View group" : "Login"}</button>
  <div class="login__error validation-error"></div>
</div>
