<section class="inventory-setups-page">
  <header class="inventory-setups-page__header">
    <div>
      <h2>Inventory Setups</h2>
      <p>Edit group-shared setups, notes, sections, and ordering.</p>
    </div>
    <a class="men-button small" href="/group/bank-tags">Bank Tags</a>
    <button class="men-button small" type="button" data-action="refresh">Refresh</button>
  </header>
  <p class="inventory-setups-page__status" role="status">Loading inventory setups…</p>
  <div class="inventory-setups-page__content">
    <nav class="inventory-setups-page__sidebar rsborder-tiny rsbackground" aria-label="Inventory setups and sections">
      <div class="inventory-setups-page__new-actions">
        <button class="men-button small" type="button" data-action="new-setup">+ Setup</button>
        <button class="men-button small" type="button" data-action="new-section">+ Section</button>
      </div>
      <ul class="inventory-setups-page__list"></ul>
    </nav>
    <main class="inventory-setups-page__editor rsborder-tiny rsbackground">
      <p>Select a setup or section.</p>
    </main>
  </div>
</section>
